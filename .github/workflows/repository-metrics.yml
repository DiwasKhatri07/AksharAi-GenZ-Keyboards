name: Repository metrics

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-metrics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'DiwasKhatri07/AksharAi-GenZ-Keyboards'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Refresh aggregate counters
        env:
          TRAFFIC_API_TOKEN: ${{ secrets.TRAFFIC_API_TOKEN }}
        run: python scripts/update_metrics.py

      - name: Commit only when metrics changed
        run: |
          if git diff --quiet -- metrics/latest.json; then
            echo 'No metrics changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics/latest.json
          git commit -m 'chore(metrics): refresh aggregate repository metrics'
          git push
